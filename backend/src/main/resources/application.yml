spring:
  application:
    name: leera-backend
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}

leera:
  # Secrets: environment only, never committed.
  app-token: ${LEERA_APP_TOKEN:}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    model: ${LEERA_MODEL:claude-sonnet-5-5}
    max-tokens: 4096
    timeout: 90s
  rate-limit:
    requests-per-hour: ${LEERA_REQUESTS_PER_HOUR:60}
