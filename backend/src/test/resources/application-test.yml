spring:
  datasource:
    url: jdbc:h2:mem:leera;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

leera:
  anthropic:
    api-key: test-key
    base-url: http://localhost:9
    model: claude-test
    max-tokens: 1024
    timeout: 5s
  rate-limit:
    requests-per-hour: 1000
  auth:
    session-secret: test-secret-that-is-long-enough-0123456789
    session-lifetime: 30d
    apple-audiences: dev.penda.leera
    apple-keys-url: http://localhost:9/keys
  quota:
    free-per-week: 1
    plus-per-day: 3
